name: CI/CD Pipeline - Mailee E-Commerce

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: 🧪 Syntax & Code Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, gd, intl, pdo_mysql

      - name: Validate composer.json
        run: composer validate --no-check-all

      - name: Check PHP Syntax (Lint)
        run: |
          find app config database routes modules -name "*.php" -print0 | xargs -0 -n1 php -l

  deploy:
    name: 🚀 Deploy to Production Server
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Execute deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /home/rds2197/ecom
            bash deploy.sh
