version: '3.8'

services:
  fleetcart_db:
    image: mariadb:10.6
    container_name: fleetcart_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: fleetcart_root_password
      MYSQL_DATABASE: fleetcart_db
      MYSQL_USER: fleetcart_user
      MYSQL_PASSWORD: fleetcart_password
    volumes:
      - fleetcart_db_data:/var/lib/mysql
    networks:
      - fleetcart_internal

  ecom_app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ecom_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: "FleetCart"
      APP_ENV: production
      APP_DEBUG: "true"
      APP_URL: "https://onlinemailee.in"
      DB_CONNECTION: mysql
      DB_HOST: fleetcart_db
      DB_PORT: 3306
      DB_DATABASE: fleetcart_db
      DB_USERNAME: fleetcart_user
      DB_PASSWORD: fleetcart_password
    volumes:
      - ./:/var/www/html
    depends_on:
      - fleetcart_db
    networks:
      - fleetcart_internal
      - proxy_network

  ecom_web:
    image: nginx:alpine
    container_name: ecom_web
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ecom_app
    networks:
      - fleetcart_internal
      - proxy_network

networks:
  fleetcart_internal:
    driver: bridge
  proxy_network:
    external: true

volumes:
  fleetcart_db_data:
